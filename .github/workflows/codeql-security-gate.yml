name: CodeQL Security Gate

on:
  pull_request:
    branches: ["main"]

permissions: {}

jobs:
  codeql-security-gate:
    uses: ClareAI/devops-github-workflow/.github/workflows/codeql-security-gate.yml@master
    with:
      soft-fail: false
    secrets:
      CODEQL_GATE_NOTIFICATION_TOKEN: ${{ secrets.CODEQL_GATE_NOTIFICATION_TOKEN }}
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
      security-events: read
